name: Opdater dashboard

# Opdatering hver halve time:
# Hver kørsel bygger siden og venter derefter til næste :07 eller :37,
# hvorefter den selv starter næste kørsel. GitHubs egen tidsplan (schedule)
# er upålidelig og bruges kun som reserve, hvis kæden skulle gå i stå.
# Offentlige repositories har ubegrænsede gratis Actions-minutter.

on:
  schedule:
    - cron: "7,37 * * * *"   # reserve – GitHub springer ofte disse over
  workflow_dispatch:      # manuel kørsel fra fanen Actions (starter også kæden)
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hent data og byg siden
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          export PREV_DATA_URL="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/data.json"
          python scripts/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub Pages svarer af og til med midlertidige serverfejl – prøv op til 3 gange
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Vent før nyt forsøg
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Vent før sidste forsøg
        if: steps.deploy2.outcome == 'failure'
        run: sleep 180
      - id: deployment
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4

  next-run:
    needs: build-deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # GitHub slår planlagte kørsler fra efter 60 dage uden aktivitet – et lille dagligt commit forhindrer det.
      - uses: actions/checkout@v4
      - name: Hold repoet aktivt
        run: |
          today=$(date -u +%F)
          if [ "$(cat .keepalive 2>/dev/null)" != "$today" ]; then
            echo "$today" > .keepalive
            git config user.name "dashboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive $today [skip ci]"
            git pull --rebase -q || true
            git push || true
          fi

      - name: Vent til næste halve time (:07 eller :37)
        run: |
          now=$(date -u +%s)
          next=$(( ((now - 420) / 1800 + 1) * 1800 + 420 ))
          # Er der under 10 min til, hoppes en halv time videre, så vi ikke kører to gange tæt på hinanden
          if [ $(( next - now )) -lt 600 ]; then next=$(( next + 1800 )); fi
          echo "Næste opdatering: $(date -u -d @$next '+%F %H:%M') UTC"
          sleep $(( next - now ))

      - name: Start næste kørsel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Undgå dobbelte kæder: findes en NYERE kørsel, der venter eller kører, overlader vi kæden til den
          others=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id > $GITHUB_RUN_ID and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\"))] | length")
          if [ "$others" -gt 0 ]; then
            echo "En anden kørsel er allerede i gang – kæden fortsætter derfra."
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/dispatches" -f ref=main
            echo "Næste kørsel startet."
          fi
